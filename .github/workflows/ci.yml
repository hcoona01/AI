name: CI Workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_full_benchmark:
        description: 'Run full benchmark profile and upload artifacts'
        type: boolean
        default: true

jobs:
  lint-and-test:
    name: Lint, Test, Build, E2E & Benchmark (Quick)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest pytest-cov coverage playwright pytest-playwright
          pip install -r backend/requirements.txt
          pip install -r ml/requirements-train.txt
          pip install -e ml

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Lint Python Code
        run: |
          ruff check backend ml
          black --check backend ml

      - name: Run Backend & ML Unit Tests (Coverage >=80%)
        run: |
          PYTHONPATH=.:backend:ml coverage run -m pytest backend/tests ml/tests -q -m "not e2e and not slow"
          coverage report --include="backend/app/services/constraint_engine.py,backend/app/repositories/*,backend/app/api/v1/auth.py,backend/app/core/security.py" --fail-under=80

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

      - name: Run Playwright E2E Tests
        run: |
          PYTHONPATH=.:backend:ml pytest tests/e2e -m e2e -v

      - name: Run Benchmark Quick Profile (< 2 min)
        run: |
          PYTHONPATH=.:backend:ml python ml/benchmark/run_benchmark.py --profile quick

  full-benchmark:
    name: Full Benchmark Suite (Manual Workflow Dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ml/requirements-train.txt
          pip install -e ml

      - name: Execute Full Benchmark (All Fixtures, P50+P90, 3 Seeds)
        run: |
          PYTHONPATH=.:backend:ml python ml/benchmark/run_benchmark.py --profile full

      - name: Upload Benchmark Results & Visualizations
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-full-artifacts
          path: |
            ml/artifacts/benchmark_full.json
            docs/benchmark.md
            docs/img/*.png
          retention-days: 30
