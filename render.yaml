services:
  - type: web
    name: faculty-workload-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORE_BACKEND
        value: local
      - key: FORECAST_MODE
        value: precomputed
      - key: OTP_DEV_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

